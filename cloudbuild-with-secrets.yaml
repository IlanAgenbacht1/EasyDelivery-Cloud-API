steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'africa-south1-docker.pkg.dev/$PROJECT_ID/delivery-repo/delivery-cloud-api:$BUILD_ID', '.']
  
  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'africa-south1-docker.pkg.dev/$PROJECT_ID/delivery-repo/delivery-cloud-api:$BUILD_ID']
  
  # Deploy to Cloud Run with secrets
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'delivery-cloud-api'
    - '--image=africa-south1-docker.pkg.dev/$PROJECT_ID/delivery-repo/delivery-cloud-api:$BUILD_ID'
    - '--region=africa-south1'
    - '--platform=managed'
    - '--port=8080'
    - '--memory=512Mi'
    - '--cpu=1'
    - '--min-instances=0'
    - '--max-instances=10'
    - '--timeout=300'
    - '--allow-unauthenticated'
    - '--set-env-vars=FIRESTORE_PROJECT_ID=$PROJECT_ID'
    - '--set-env-vars=ASPNETCORE_ENVIRONMENT=Production'
    - '--update-secrets=GoogleMaps__ApiKey=google-maps-api-key:latest'

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/google-maps-api-key/versions/latest
    env: 'GOOGLE_MAPS_API_KEY'

options:
  machineType: 'E2_MEDIUM'

timeout: '1200s'